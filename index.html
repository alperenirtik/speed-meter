<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speed Meter - Alperen İrtik</title>
    <link rel="icon" href="favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'digital': ['Orbitron', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>

<body class="flex flex-col min-h-screen bg-gradient-to-br from-gray-900 to-gray-800">
    <!-- Header -->
    <header class="w-full bg-gray-800 shadow-lg p-4">
        <div class="container mx-auto flex items-center justify-center">
            <i class="fas fa-gauge-high text-3xl text-white mr-3"></i>
            <h1 class="text-3xl font-digital text-white tracking-wider font-bold">Speed Meter</h1>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center">
        <div class="speedometer">
            <div class="speed-indicator"></div>
            <div class="center-point"></div>
            <div class="speed-marks"></div>
            <div class="current-speed">0</div>
            <div class="speed-unit">km/h</div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full bg-gray-800 p-6">
        <div class="container mx-auto flex flex-wrap justify-center gap-4">
            <a href="https://www.alperenirtik.com/" target="_blank" class="flex items-center gap-2 px-4 py-2 bg-gray-700 hover:bg-gray-600 rounded-lg text-white transition-colors">
                <i class="fas fa-home text-lg"></i> Kişisel Sitem
            </a>
            <a href="https://www.ankasoftyazilim.com/" target="_blank" class="flex items-center gap-2 px-4 py-2 bg-gray-700 hover:bg-gray-600 rounded-lg text-white transition-colors">
                <i class="fas fa-building text-lg"></i> Firma Sitem
            </a>
            <a href="https://github.com/alperenirtik" target="_blank" class="flex items-center gap-2 px-4 py-2 bg-gray-700 hover:bg-gray-600 rounded-lg text-white transition-colors">
                <i class="fab fa-github text-lg"></i> Github İndir
            </a>
            <a href="https://www.linkedin.com/in/alperen-irtik-823564233/" target="_blank" class="flex items-center gap-2 px-4 py-2 bg-gray-700 hover:bg-gray-600 rounded-lg text-white transition-colors">
                <i class="fab fa-linkedin text-lg"></i> Linkedin
            </a>
        </div>
    </footer>

    <script src="script.js"></script>
</body>

</html>
